<!DOCTYPE html>
<html lang="en">
    <link>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Loopo — Coming Soon</title>
        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
        <link rel="icon" type="image/svg+xml" href="logo.svg">

        <style>
            :root {
                --bg-soft-cotton: #F5F5F7;
                --card-pure-wool: #FFFFFF;
                --text-charcoal: #1C1C1E;
                --text-misty: #8E8E93;
                --accent-coral: #FF5A5F;
                --badge-chalk: #EFEFF4;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                font-family: 'Comfortaa', sans-serif;
                background-color: var(--bg-soft-cotton);
                color: var(--text-charcoal);
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
            }

            .bento-container {
                background-color: var(--card-pure-wool);
                border-radius: 32px;
                padding: 50px 40px;
                width: 100%;
                max-width: 480px;
                text-align: center;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
                border: 1px solid rgba(0, 0, 0, 0.02);
            }

            .brand-area {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-bottom: 35px;
            }

            .logo-mark {
                width: 90px;
                height: 90px;
                margin-bottom: 12px;
                object-fit: contain;
            }

            .logo-wordmark {
                font-size: 32px;
                font-weight: 700;
                letter-spacing: -1px;
                color: var(--text-charcoal);
            }

            .status-badge {
                display: inline-block;
                background-color: var(--badge-chalk);
                color: var(--text-charcoal);
                font-size: 12px;
                font-weight: 600;
                padding: 6px 14px;
                border-radius: 999px;
                margin-bottom: 25px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
            }

            h1 {
                font-size: 24px;
                font-weight: 700;
                line-height: 1.3;
                margin-bottom: 18px;
            }

            p {
                color: var(--text-misty);
                font-size: 14px;
                line-height: 1.6;
            }

            .footer-text {
                margin-top: 45px;
                font-size: 11px;
                color: var(--text-misty);
            }
        </style>
    </head>
    <body>
        <div class="bento-container">    
            <div class="brand-area">
                <img class="logo-mark" src="logo.svg" alt="Loopo Logo">
            </div>
            <div class="status-badge">Coming Soon</div>
            <h1>Knitting, perfectly organized.</h1>
            <p>A smart Bento-style companion app designed to track your rows, manage your yarn stash, and bring your creative projects to life without ever losing your place.</p>
            <div class="footer-text">
                © 2026 Loopo App. Crafted for mindful makers.
            </div>
        </div>
    </body>
</html>
